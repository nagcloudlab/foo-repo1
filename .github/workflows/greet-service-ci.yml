name: Greet Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  checks: write

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: greet-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn clean compile -DskipTests

      - name: Unit Tests
        run: mvn test -Dtest="GreetServiceTest"

      - name: Integration Tests
        run: mvn test -Dtest="GreetApiControllerIntegrationTest"

      - name: API Tests
        run: mvn test -Dtest="GreetApiRestAssuredTest"

      - name: Package
        run: mvn package -DskipTests

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: greet-service-jar
          path: greet-service/target/*.jar

      - name: Create Maven Settings
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASS: ${{ secrets.NEXUS_PASS }}
        run: |
          echo "<settings><servers><server><id>nexus-snapshots</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server><server><id>nexus-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASS}</password></server></servers></settings>" > settings.xml

      - name: Publish to Nexus
        run: |
          mvn deploy -DskipTests -s settings.xml \
            -DaltDeploymentRepository=nexus-snapshots::http://20.204.90.26:8081/repository/maven-snapshots/
          rm -f settings.xml
